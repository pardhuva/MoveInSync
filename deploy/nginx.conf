# WebSocket-aware load balancer in front of the gateway nodes.
worker_processes auto;
events { worker_connections 16384; }

http {
    # Map the Upgrade header so WebSocket connections are proxied, not buffered.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    upstream gateways {
        # least_conn spreads long-lived WebSocket connections evenly. A crashed node is
        # marked down after max_fails and traffic shifts to the survivor; clients reconnect
        # and resume from the shared Redis backbone.
        least_conn;
        server gateway-1:8080 max_fails=2 fail_timeout=10s;
        server gateway-2:8080 max_fails=2 fail_timeout=10s;
    }

    server {
        listen 8080;

        # WebSocket endpoint: long timeouts so idle subscribers are not cut off.
        location /ws/live {
            proxy_pass http://gateways;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # REST (publish, admin, dev tokens, actuator).
        location / {
            proxy_pass http://gateways;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}
